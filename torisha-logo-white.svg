<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B7"/>
      <stop offset="35%" stop-color="#C8A961"/>
      <stop offset="70%" stop-color="#9E7E38"/>
      <stop offset="100%" stop-color="#E2C989"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#D4B46A"/>
      <stop offset="100%" stop-color="#8A6A27"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C8A961" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LOGO MARK ICON -->
  <g transform="translate(10, 5)" filter="url(#goldGlow)">
    <!-- Roof Peak -->
    <path d="M 8 50 L 62 12 L 116 50" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 50 L 62 12 L 116 50" fill="none" stroke="#FFF5D6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <!-- House Outer Frame -->
    <path d="M 20 50 L 20 104 L 104 104 L 104 50" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Window 4-Pane Grid -->
    <g transform="translate(78, 76)">
      <rect x="0" y="0" width="18" height="18" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
      <line x1="9" y1="0" x2="9" y2="18" stroke="url(#goldGrad)" stroke-width="1.8"/>
      <line x1="0" y1="9" x2="18" y2="9" stroke="url(#goldGrad)" stroke-width="1.8"/>
    </g>

    <!-- Monogram TP -->
    <!-- T Top Bar & Stem -->
    <path d="M 34 32 C 34 32, 50 30, 62 30 C 74 30, 86 32, 86 32 C 84 35, 76 35, 72 37 L 72 96 C 72 100, 76 101, 80 101 C 76 104, 66 104, 60 104 C 54 104, 44 104, 40 101 C 44 101, 48 100, 48 96 L 48 37 C 44 35, 36 35, 34 32 Z" fill="url(#goldGrad2)"/>
    <!-- P Loop -->
    <path d="M 60 33 C 72 33, 96 33, 96 52 C 96 68, 74 72, 60 72 L 60 59 C 72 59, 82 57, 82 51 C 82 43, 70 43, 60 43 Z" fill="url(#goldGrad2)"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(142, 0)">
    <!-- Main Title "TORISHA" -->
    <text x="0" y="58" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" fill="#FFFFFF" letter-spacing="7">TORISHA</text>
    
    <!-- Rule Lines & "PROPERTIES" -->
    <line x1="0" y1="78" x2="52" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="83" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="url(#goldGrad)" letter-spacing="7.5">PROPERTIES</text>
    <line x1="282" y1="78" x2="335" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Sub-tagline -->
    <text x="2" y="107" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.5" fill="#E6DACB" letter-spacing="3.2">REAL ESTATE &amp; PROPERTY MANAGEMENT</text>
  </g>
</svg>

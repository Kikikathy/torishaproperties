<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B7"/>
      <stop offset="50%" stop-color="#C8A961"/>
      <stop offset="100%" stop-color="#8A6A27"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#17100C"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.6"/>
  
  <g transform="translate(4, 2)">
    <!-- Roof Peak -->
    <path d="M 8 28 L 28 8 L 48 28" fill="none" stroke="url(#favGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Outer Frame -->

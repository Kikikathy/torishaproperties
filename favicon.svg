      <line x1="4" y1="0" x2="4" y2="8" stroke="url(#favGold)" stroke-width="1"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="url(#favGold)" stroke-width="1"/>
    </g>

    <!-- TP Monogram -->
    <path d="M 18 19 L 36 19 M 27 19 L 27 50 M 27 20 C 37 20, 44 24, 34 35 L 27 35" fill="none" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

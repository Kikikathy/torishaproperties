<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B46A"/>
      <stop offset="50%" stop-color="#9E7E38"/>
      <stop offset="100%" stop-color="#7A5D1F"/>
    </linearGradient>
    <linearGradient id="goldGrad2Dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2C989"/>
      <stop offset="50%" stop-color="#B8974B"/>
      <stop offset="100%" stop-color="#735519"/>
    </linearGradient>
  </defs>

  <!-- LOGO MARK ICON -->
  <g transform="translate(10, 5)">
    <!-- Roof Peak -->
    <path d="M 8 50 L 62 12 L 116 50" fill="none" stroke="url(#goldGradDark)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 50 L 62 12 L 116 50" fill="none" stroke="#C8A961" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    
    <!-- House Outer Frame -->
    <path d="M 20 50 L 20 104 L 104 104 L 104 50" fill="none" stroke="url(#goldGradDark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Window 4-Pane Grid -->
    <g transform="translate(78, 76)">
      <rect x="0" y="0" width="18" height="18" fill="none" stroke="url(#goldGradDark)" stroke-width="2.2"/>
      <line x1="9" y1="0" x2="9" y2="18" stroke="url(#goldGradDark)" stroke-width="1.8"/>
      <line x1="0" y1="9" x2="18" y2="9" stroke="url(#goldGradDark)" stroke-width="1.8"/>
    </g>

    <!-- Monogram TP -->
    <path d="M 34 32 C 34 32, 50 30, 62 30 C 74 30, 86 32, 86 32 C 84 35, 76 35, 72 37 L 72 96 C 72 100, 76 101, 80 101 C 76 104, 66 104, 60 104 C 54 104, 44 104, 40 101 C 44 101, 48 100, 48 96 L 48 37 C 44 35, 36 35, 34 32 Z" fill="url(#goldGrad2Dark)"/>
    <path d="M 60 33 C 72 33, 96 33, 96 52 C 96 68, 74 72, 60 72 L 60 59 C 72 59, 82 57, 82 51 C 82 43, 70 43, 60 43 Z" fill="url(#goldGrad2Dark)"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(142, 0)">
    <!-- Main Title "TORISHA" -->
    <text x="0" y="58" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" fill="#2B1E17" letter-spacing="7">TORISHA</text>
    
    <!-- Rule Lines & "PROPERTIES" -->
    <line x1="0" y1="78" x2="52" y2="78" stroke="url(#goldGradDark)" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="83" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="url(#goldGradDark)" letter-spacing="7.5">PROPERTIES</text>
    <line x1="282" y1="78" x2="335" y2="78" stroke="url(#goldGradDark)" stroke-width="2" stroke-linecap="round"/>

    <!-- Sub-tagline -->
    <text x="2" y="107" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.5" fill="#635448" letter-spacing="3.2">REAL ESTATE &amp; PROPERTY MANAGEMENT</text>
  </g>
</svg>
